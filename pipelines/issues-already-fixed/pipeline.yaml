name: issues-already-fixed
description: Finds open GitHub issues that a recent commit on the default branch already references ("fixes #12", "closes #12" or just "#12"), so you can close them by hand. Weekly, alerts only when there are some.
version: 1

params:
  repos:
    description: Space-separated list of GitHub repos as owner/name, e.g. "my-org/api my-org/web".
    required: true
  since_days:
    description: How far back to read commits on the default branch, in days.
    default: 30
  max_commits:
    description: Maximum number of commits read per repo (newest first), to keep busy repos cheap. Rounded up to a multiple of 100.
    default: 500

requires:
  bin: [curl, jq]
  env: [GITHUB_TOKEN]
  net: [api.github.com]

triggers:
  - cron: "0 9 * * 1"

notify:
  on: [failed]
  stale_after: 192h
  channel: macos

steps:
  - id: check
    type: shell
    timeout: 10m
    run: |
      set -euo pipefail
      since_days="{{params.since_days}}"
      max_pages=$(( ({{params.max_commits}} + 99) / 100 ))
      since=$(date -u -v-"${since_days}"d '+%Y-%m-%dT%H:%M:%SZ')
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT

      # GET a GitHub API URL into $tmp/body; prints the HTTP status code.
      gh_get() {
        curl -sS -o "$tmp/body" -w '%{http_code}' --max-time 30 \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" "$1" 2>/dev/null || echo 000
      }
      api_error() {
        printf 'GitHub API answered HTTP %s (%s)' "$1" "$(jq -r '.message? // empty' "$tmp/body" 2>/dev/null || true)"
      }

      total=0
      errors=0
      sections=""
      for repo in {{params.repos}}; do
        echo "checking $repo" >&2
        code=$(gh_get "https://api.github.com/repos/$repo")
        if [ "$code" != "200" ]; then
          errors=$((errors + 1))
          sections="$sections## [$repo](https://github.com/$repo)

      Could not read the repo: $(api_error "$code").

      "
          continue
        fi
        branch=$(jq -r '.default_branch' "$tmp/body")
        open_count=$(jq -r '.open_issues_count' "$tmp/body")

        # 1. Commits on the default branch in the window.
        echo '[]' > "$tmp/commits.json"
        page=1
        err=""
        truncated=0
        while :; do
          code=$(gh_get "https://api.github.com/repos/$repo/commits?sha=$branch&since=$since&per_page=100&page=$page")
          if [ "$code" != "200" ]; then err=$(api_error "$code"); break; fi
          jq -s 'add' "$tmp/commits.json" "$tmp/body" > "$tmp/m.json" && mv "$tmp/m.json" "$tmp/commits.json"
          [ "$(jq 'length' "$tmp/body")" -eq 100 ] || break
          if [ "$page" -ge "$max_pages" ]; then truncated=1; break; fi
          page=$((page + 1))
        done
        if [ -n "$err" ]; then
          errors=$((errors + 1))
          sections="$sections## [$repo](https://github.com/$repo)

      Could not read commits: $err.

      "
          continue
        fi
        n_commits=$(jq 'length' "$tmp/commits.json")

        # 2. Every "#N" in each message. GitHub's own pull request references
        # (a squash merge's trailing "(#N)", "Merge pull request #N") are dropped:
        # they point at the PR that carried the commit, never at an issue.
        jq '
          [ .[]
            | . as $c
            | (.commit.message | split("\n")) as $lines
            | ($lines[0]) as $first
            | (($first | sub("[[:space:]]*\\(#[0-9]+\\)[[:space:]]*$"; "") | sub("^Merge pull request #[0-9]+"; "Merge pull request"))
               + "\n" + ($lines[1:] | join("\n"))) as $text
            | [$text | scan("(?i)\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?[[:space:]]+#([0-9]+)\\b") | .[0] | tonumber] as $strong
            | [$text | scan("(?<![[:alnum:]_/&#])#([0-9]+)\\b") | .[0] | tonumber] | unique[]
            | . as $n
            | { num: $n, strong: ($strong | any(. == $n)), sha: $c.sha[0:7], url: $c.html_url,
                first: $first, date: $c.commit.committer.date } ]' "$tmp/commits.json" > "$tmp/refs.json"
        # Closing-keyword references first, so a lookup cap never hides them.
        nums=$(jq -r 'group_by(.num) | map({num: .[0].num, s: (if any(.[]; .strong) then 0 else 1 end)}) | sort_by(.s, .num) | .[].num' "$tmp/refs.json")
        n_refs=$(jq '[.[].num] | unique | length' "$tmp/refs.json")
        echo "$repo: $n_commits commits since $since, $n_refs referenced numbers" >&2

        # 3. Which of those numbers are open issues (not PRs)? Small repos: list all
        # open issues. Big repos: look each referenced number up (capped).
        echo '[]' > "$tmp/issues.json"
        lookup_note=""
        if [ "$n_refs" -gt 0 ]; then
          if [ "$open_count" -le 1000 ]; then
            page=1
            while [ "$page" -le 10 ]; do
              code=$(gh_get "https://api.github.com/repos/$repo/issues?state=open&per_page=100&page=$page")
              if [ "$code" != "200" ]; then err=$(api_error "$code"); break; fi
              jq '[.[] | select(.pull_request | not) | {number, title, html_url, created_at}]' "$tmp/body" > "$tmp/p.json"
              jq -s 'add' "$tmp/issues.json" "$tmp/p.json" > "$tmp/m.json" && mv "$tmp/m.json" "$tmp/issues.json"
              [ "$(jq 'length' "$tmp/body")" -eq 100 ] || break
              page=$((page + 1))
            done
          else
            looked=0
            for n in $nums; do
              if [ "$looked" -ge 150 ]; then lookup_note="Only the first 150 referenced numbers were looked up."; break; fi
              looked=$((looked + 1))
              code=$(gh_get "https://api.github.com/repos/$repo/issues/$n")
              [ "$code" = "200" ] || continue
              jq 'select(.state == "open" and (.pull_request | not)) | {number, title, html_url, created_at}' "$tmp/body" >> "$tmp/found.jsonl"
            done
            if [ -s "$tmp/found.jsonl" ]; then jq -s '.' "$tmp/found.jsonl" > "$tmp/issues.json"; fi
            rm -f "$tmp/found.jsonl"
          fi
        fi
        if [ -n "$err" ]; then
          errors=$((errors + 1))
          sections="$sections## [$repo](https://github.com/$repo)

      Could not read issues: $err.

      "
          continue
        fi

        # 4. Join: an open issue referenced by a commit made after the issue existed.
        jq -n --slurpfile refs "$tmp/refs.json" --slurpfile issues "$tmp/issues.json" '
          ($issues[0] | map({key: (.number | tostring), value: .}) | from_entries) as $open
          | [ $refs[0][] | select($open[.num | tostring]) | . as $r
              | select($r.date >= $open[$r.num | tostring].created_at) ]
          | group_by(.num)
          | map({ issue: $open[.[0].num | tostring], strong: any(.[]; .strong), commits: . })
          | sort_by(if .strong then 0 else 1 end, -.issue.number)' > "$tmp/hits.json"
        count=$(jq 'length' "$tmp/hits.json")
        strong=$(jq '[.[] | select(.strong)] | length' "$tmp/hits.json")
        total=$((total + count))

        notes="Read $n_commits commit(s) on \`$branch\` since $(printf '%s' "$since" | cut -c1-10)."
        if [ "$truncated" -eq 1 ]; then notes="$notes Stopped at {{params.max_commits}} commits (\`max_commits\`)."; fi
        if [ -n "$lookup_note" ]; then notes="$notes $lookup_note"; fi
        if [ "$count" -eq 0 ]; then
          sections="$sections## [$repo](https://github.com/$repo)

      No open issue is referenced by a recent commit. $notes

      "
          continue
        fi
        table=$(jq -r '
          def esc: gsub("\\|"; "\\|") | gsub("[\\[\\]]"; "");
          .[]
          | "| [#\(.issue.number) \(.issue.title | esc)](\(.issue.html_url)) | \(if .strong then "**closing keyword**" else "mention" end) | "
            + ([.commits[] | "[`\(.sha)`](\(.url)) \(.first | esc | if length > 90 then .[0:89] + "…" else . end)\(if .strong then " (closes)" else "" end)"] | join("<br>"))
            + " |"' "$tmp/hits.json")
        sections="$sections## [$repo](https://github.com/$repo): $count open issue(s) referenced, $strong with a closing keyword

      $notes

      | Issue | Reference | Commit(s) |
      |---|---|---|
      $table

      "
      done

      if [ "$errors" -gt 0 ] && [ "$total" -eq 0 ]; then title="Could not check $errors repo(s)"
      elif [ "$total" -eq 0 ]; then title="No open issue looks already fixed"
      elif [ "$total" -eq 1 ]; then title="1 open issue referenced by a recent commit"
      else title="$total open issues referenced by recent commits"; fi
      if [ "$errors" -gt 0 ] && [ "$total" -gt 0 ]; then title="$title ($errors repo(s) could not be checked)"; fi
      report=$(printf '# %s\n\n%s · commits from the last %s days on the default branch. **closing keyword** = the commit says fixes/closes/resolves #N; **mention** = it only mentions #N. Nothing was closed: check and close by hand.\n\n%s' "$title" "$(date '+%Y-%m-%d %H:%M')" "$since_days" "$sections")
      jq -n --arg r "$report" --argjson t "$total" --argjson e "$errors" '{found: $t, errors: $e, report: $r}'
    outputs:
      found: number
      errors: number
      report: string

  - id: save
    type: shell
    run: |
      set -euo pipefail
      printf '%s\n' "{{check.report}}" | sh ../../scripts/write-report.sh issues-already-fixed
    outputs:
      report: string
      headline: string

  # The red run is the alert: notify.on [failed] fires only when there is something
  # to look at (or a repo could not be read).
  - id: verdict
    type: shell
    inputs: [save.report]
    run: |
      set -euo pipefail
      if [ "{{check.found}}" -gt 0 ] || [ "{{check.errors}}" -gt 0 ]; then
        echo "{{save.headline}}. Details: {{save.report}}" >&2
        exit 1
      fi
      echo "no open issue looks already fixed" >&2
