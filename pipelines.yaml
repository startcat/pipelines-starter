# Notification channels shared by every pipeline in this repo.
# Each pipeline picks one with `notify.channel`. `default` shows a macOS
# notification on a Mac and pushes through ntfy anywhere else (it needs
# NTFY_TOPIC in .env there). `macos` and `ntfy` force one or the other.
channels:
  default:
    type: shell
    run: scripts/notify-default.sh
  macos:
    type: shell
    run: scripts/notify-macos.sh
  ntfy:
    type: shell
    env: [NTFY_TOPIC]
    run: scripts/notify-ntfy.sh
